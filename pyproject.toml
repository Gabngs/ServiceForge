[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-forge"
version = "1.0.0"
description = "Prototipo: generador de boilerplate backend (Laravel) + interfaces frontend (Angular) a partir de la base de datos"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "PyMySQL>=1.1",
    "Jinja2>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
